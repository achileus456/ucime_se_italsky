:root{
  --cream:#fbf6ea; --paper:#fffdf7; --ink:#2b2118; --muted:#6f5f4d;

  --serif:'Playfair Display',Georgia,'Times New Roman',serif;

}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;

header{max-width:960px;margin:0 auto;padding:22px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

.brand h1 span{color:var(--red)}

.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
button.chip.lvl{border-color:var(--green);color:var(--green-d);cursor:pointer}
button.chip.lvl:hover{background:#e8f4ec}
nav{max-width:960px;margin:8px auto 0;padding:0 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line)}
nav button{font:inherit;font-weight:700;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button:hover{color:var(--ink)}

main{max-width:960px;margin:0 auto;padding:22px 16px 60px}
h2{font-family:var(--serif);font-size:1.7rem;margin:0 0 6px}
h3{font-family:var(--serif);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 0 var(--line)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{font:inherit;font-weight:700;border:2px solid var(--green);background:var(--green);color:#fff;border-radius:12px;padding:10px 18px;cursor:pointer;transition:transform .08s}
.btn:hover{background:var(--green-d)} .btn:active{transform:translateY(1px)}
.btn.red{background:var(--red);border-color:var(--red)} .btn.red:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--green-d)} .btn.ghost:hover{background:#e8f4ec}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}
.nosound .sp{display:none}

.level{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s,border-color .12s}
.level:hover{transform:translateY(-3px);border-color:var(--terra)}
.level b{font-family:var(--serif);font-size:2rem;color:var(--red);display:block;line-height:1}
.level.on{border-color:var(--green);box-shadow:0 3px 0 var(--green)}

.arch{max-width:380px;margin:0 auto 18px;min-height:280px;background:var(--paper);border:3px solid var(--terra);
  border-radius:190px 190px 18px 18px;padding:56px 24px 28px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--line);

.arch .it{font-family:var(--serif);font-size:2.3rem;font-weight:800}
.arch .cs{font-size:1.5rem;color:var(--green-d);font-weight:700}
.arch .ex{font-style:italic;color:var(--muted);font-size:.95rem}
.arch .hint{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;background:#f3e6c9;color:#6d4f12;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:700}

.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:14px 0}
.opt{font:inherit;font-weight:700;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center}

.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
input[type=text]{font:inherit;width:100%;max-width:360px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}

.lesson p,.lesson li{margin:6px 0} .lesson table{border-collapse:collapse;margin:10px 0;display:block;overflow-x:auto}
.lesson td,.lesson th{border:1px solid var(--line);padding:5px 12px;text-align:left} .lesson th{background:#f3e6c9}
.lesson em{color:var(--red-d)}
.phrase{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}

  nav button[aria-current="page"]{border-color:var(--red);background:#fdeeee}
  .arch{border-radius:150px 150px 18px 18px;padding-top:44px}
}

/* ============ STATE ============ */
const LS_KEY = "italiano-v1";
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const defaults = () => ({level:null, xp:0, streak:0, lastDay:null, mastery:{}, learned:{}, grammarDone:{}});
function sanitize(raw){
  const s = defaults();
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return s;
  if (typeof raw.level === "string" && has(LEVELS, raw.level)) s.level = raw.level;
  if (Number.isFinite(raw.xp) && raw.xp > 0) s.xp = Math.floor(raw.xp);
  if (Number.isFinite(raw.streak) && raw.streak > 0) s.streak = Math.floor(raw.streak);
  if (typeof raw.lastDay === "string" && /^\d{4}-\d{2}-\d{2}$/.test(raw.lastDay)) s.lastDay = raw.lastDay;
  const each = (o, f) => { if (o && typeof o === "object" && !Array.isArray(o)) for (const k of Object.keys(o)) f(k, o[k]); };
  each(raw.mastery, (k,v) => { if (Number.isFinite(v) && v > 0) s.mastery[k] = Math.min(4, Math.floor(v)); });
  each(raw.learned, (k,v) => { if (v === true) s.learned[k] = true; });
  each(raw.grammarDone, (k,v) => { if (v === true) s.grammarDone[k] = true; });
  each(raw.known, (k,v) => { if (v === true) { s.mastery[k] = Math.max(s.mastery[k]||0, 3); s.learned[k] = true; } }); // starší verze
  return s;
}
let S = defaults();
try { S = sanitize(JSON.parse(localStorage.getItem(LS_KEY))); } catch(e) {}
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} };
const dayKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function touch(){
  const t = dayKey(new Date());
  if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  S.streak = S.lastDay === dayKey(y) ? S.streak+1 : 1;
  S.lastDay = t;
}
function curStreak(){
  const now = new Date(), y = new Date(); y.setDate(y.getDate()-1);
  return (S.lastDay === dayKey(now) || S.lastDay === dayKey(y)) ? S.streak : 0;
}
const isKnown = id => (S.mastery[id]||0) >= 2;
function setMastery(id, val){
  const was = isKnown(id);
  S.mastery[id] = Math.max(0, Math.min(4, val));
  touch();
  if (!was && isKnown(id) && !S.learned[id]){ S.learned[id] = true; S.xp += 5; }   // XP jen za nově naučené slovo
  save(); renderStats();
}
const bump = (id, ok) => setMastery(id, (S.mastery[id]||0) + (ok ? 1 : -1));
function lessonDone(key, correct){            // XP jen při prvním splnění lekce
  touch();
  if (!S.grammarDone[key]){ S.grammarDone[key] = true; S.xp += correct*5; }
  save(); renderStats();
}

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IT = s => `<span lang="it">${esc(s)}</span>`;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[’‘`´]/g,"'").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();
const WC = {};
function wordsOf(lvl){
  return WC[lvl] || (WC[lvl] = WORDS[lvl].map((w,i) => ({
    id:lvl+"-"+i, it:w[0], cs:w[1], ex:w[2], art:w[3]||"",
    full: w[3] ? (w[3].endsWith("'") ? w[3]+w[0] : w[3]+" "+w[0]) : w[0],
    mean: w[1].toLowerCase().split(/\s*,\s*/)
  })));
}
const sameMeaning = (a,b) => a.mean.some(m => b.mean.includes(m));
const pick = (ws,n) => { const u = shuffle(ws.filter(w => !isKnown(w.id))), k = shuffle(ws.filter(w => isKnown(w.id))); return u.concat(k).slice(0,n); };
const mcq = ([q,c,...w]) => ({q, opts:shuffle([c,...w]).map(t => ({t, ok:t===c}))});
/* výslovnost */
let itVoice = null, voicesFinal = false;
const speechOK = "speechSynthesis" in window;
function loadVoices(){
  let ok = speechOK;
  if (speechOK){
    const vs = speechSynthesis.getVoices();
    itVoice = vs.find(v => /^it([-_]|$)/i.test(v.lang)) || null;
    if (vs.length) voicesFinal = true;
    if (voicesFinal && !itVoice) ok = false;
    if (!vs.length && voicesFinal) ok = false;
  }
  document.body.classList.toggle("nosound", !ok);
}
function speak(text){
  if (!speechOK || document.body.classList.contains("nosound")) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "it-IT"; u.rate = .9;
  if (itVoice) u.voice = itVoice;
  speechSynthesis.speak(u);
}
const spBtn = (t, label="") => `<button class="btn ghost speak sp" data-act="say" data-t="${esc(t)}" aria-label="Přehrát výslovnost: ${esc(t)}">🔊${label}</button>`;

/* ============ EVENTS ============ */
let resetArmed = false;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset, m = $("#main");
  switch (d.act){
    case "go": go(d.v); break;
    case "changeLevel": view = "home"; renderNav(); levelPicker(m, S.level); m.focus({preventScroll:true}); break;
    case "pick": if (!has(LEVELS,d.l)) break; S.level = d.l; save(); go("home"); break;
    case "placement":
      PT = {i:0, bands:{A1:0,A2:0,B1:0,B2:0}, items:PLACEMENT.map(([lvl,q,c,...w]) => ({lvl, ...mcq([q,c,...w])}))};
      placementStep(m); break;
    case "ptAns": { const q = PT.items[PT.i]; if (q.opts[+d.i].ok) PT.bands[q.lvl]++; PT.i++; placementStep(m); break; }
    case "ptSkip": PT.i++; placementStep(m); break;
    case "say": speak(d.t); break;
    case "flip": flipCard(); break;
    case "cardYes": { const w = CQ.shift(); CShow = false; setMastery(w.id, Math.max(2, S.mastery[w.id]||0)); drawCard(); break; }
    case "cardNo": { const w = CQ.shift(); CQ.push(w); CShow = false; bump(w.id,false); drawCard(); break; }
    case "resetKnown": wordsOf(S.level).forEach(w => delete S.mastery[w.id]); save(); go("cards"); break;
    case "resetAll":
      if (!resetArmed){ resetArmed = true; el.textContent = "Opravdu smazat? Klikněte znovu"; setTimeout(() => { resetArmed = false; if (el.isConnected) el.textContent = "Smazat veškerý pokrok"; }, 4000); break; }
      resetArmed = false; S = Object.assign(defaults(), {level:S.level}); save(); go("home"); break;
    case "qAns": {
      const c = Q.cur, ok = +d.i === c.correct;
      document.querySelectorAll(".opt").forEach((b,i) => { b.disabled = true; if (i===c.correct) b.classList.add("ok"); });
      if (ok) Q.score++; else el.classList.add("bad");
      bump(c.w.id, ok);
      const fb = $(".fb"); fb.className = "fb " + (ok?"ok":"bad");
      fb.innerHTML = (ok?"Správně! ":"Ne tak docela. ") + `${IT(c.w.full)} = ${esc(c.w.cs)}<br><span class="sub" style="font-weight:400;font-style:italic">${IT(c.w.ex)}</span> ${spBtn(c.w.full)} <button class="btn" data-act="qNext" style="margin-left:8px">${Q.i+1>=Q.items.length?"Výsledek":"Dál"} →</button>`;
      $("[data-act=qNext]").focus(); break;
    }
    case "qNext": Q.i++; quizStep(); $("#main").focus({preventScroll:true}); break;
    case "wNext": W.i++; writeStep(); break;
    case "lesson": lessonView(+d.i); break;
    case "gAns": {
      const q = GL.qs[+d.q], ok = q.opts[+d.i].ok;
      el.parentElement.querySelectorAll(".opt").forEach((b,i) => { b.disabled = true; if (q.opts[i].ok) b.classList.add("ok"); });
      if (!ok) el.classList.add("bad"); else GL.correct++;
      if (++GL.answered === GL.qs.length){
        const total = GL.qs.length, pass = GL.correct >= total-1, fb = $("#gfb"), first = !S.grammarDone[GL.key];
        fb.className = "fb " + (pass?"ok":"bad");
        if (pass){
          fb.textContent = `Splněno: ${GL.correct} / ${total}` + (first ? ` · +${GL.correct*5} XP` : "");
          lessonDone(GL.key, GL.correct);
        } else {
          fb.innerHTML = `Zatím ${GL.correct} / ${total}. Zkuste to znovu: <button class="btn small" data-act="lesson" data-i="${GL.i}">Zkusit znovu</button>`;
        }
      }
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if ((e.key==="Enter"||e.key===" ") && e.target.matches('.arch[data-act="flip"]')){ e.preventDefault(); flipCard(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "wform") return;
  e.preventDefault();
  if (W.checked) return;
  const raw = $("#winp").value, ans = norm(raw), fb = $("#wfb");
  if (!ans){ fb.className = "fb bad"; fb.textContent = "Napište odpověď."; return; }
  W.checked = true;
  const w = W.items[W.i], pool = wordsOf(S.level);
  let ok = ans === norm(w.it) || ans === norm(w.full), alt = null;
  if (!ok){
    alt = pool.find(x => x.id !== w.id && (ans === norm(x.it) || ans === norm(x.full)) && sameMeaning(x,w));
    ok = !!alt;
  }
  if (ok) W.score++;
  bump(w.id, ok);
  $("#winp").disabled = true;
  const lc = raw.trim().toLowerCase(), accentNote = ok && !alt && lc !== w.it && lc !== w.full && lc.replace(/[’‘`´]/g,"'") !== w.full;
  fb.className = "fb " + (ok?"ok":"bad");
  fb.innerHTML = (ok ? (alt ? `Také správně! (${IT(alt.full)}). Hledané slovo bylo ` : "Perfetto! ") : "Správně je: ") + `${IT(w.full)}` +
    (accentNote ? `<br><span class="sub" style="font-weight:400">Pozor na přízvuk / psaní: ${IT(w.full)}</span>` : "") +
    ` ${spBtn(w.full)} <button class="btn" type="button" data-act="wNext" style="margin-left:8px">${W.i+1>=W.items.length?"Výsledek":"Dál"} →</button>`;
  $("[data-act=wNext]").focus();
});

/* ============ START ============ */
if (speechOK){ speechSynthesis.onvoiceschanged = loadVoices; setTimeout(() => { voicesFinal = true; loadVoices(); }, 1500); }
loadVoices();
renderStats(); go("home");
</script>
