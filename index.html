<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impariamo l'italiano – učíme se italsky</title>
<meta name="description" content="Interaktivní aplikace pro výuku italštiny podle vaší pokročilosti (A1–B2).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf6ea; --paper:#fffdf7; --ink:#2b2118; --muted:#7a6a58;
  --green:#008c45; --green-d:#006b35; --red:#cd212a; --red-d:#a31a21;
  --terra:#c8553d; --gold:#d9a441; --line:#e6dbc4;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px,rgba(200,85,61,.08) 1px,transparent 0);background-size:22px 22px}
.tricolore{height:8px;background:linear-gradient(90deg,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%);border-bottom:1px solid var(--line)}
header{max-width:960px;margin:0 auto;padding:22px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand h1{font-family:var(--serif);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;line-height:1.1}
.brand h1 span{color:var(--red)}
.brand p{margin:2px 0 0;color:var(--muted);font-style:italic;font-family:var(--serif)}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.lvl{border-color:var(--green);color:var(--green-d);cursor:pointer}
nav{max-width:960px;margin:8px auto 0;padding:0 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line)}
nav button{font:inherit;font-weight:700;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--red);border-bottom-color:var(--red)}
main{max-width:960px;margin:0 auto;padding:22px 16px 60px}
h2{font-family:var(--serif);font-size:1.7rem;margin:0 0 6px}
h3{font-family:var(--serif);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 0 var(--line)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{font:inherit;font-weight:700;border:2px solid var(--green);background:var(--green);color:#fff;border-radius:12px;padding:10px 18px;cursor:pointer;transition:transform .08s}
.btn:hover{background:var(--green-d)} .btn:active{transform:translateY(1px)}
.btn.red{background:var(--red);border-color:var(--red)} .btn.red:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--green-d)} .btn.ghost:hover{background:#e8f4ec}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}
/* level picker */
.level{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s,border-color .12s}
.level:hover{transform:translateY(-3px);border-color:var(--terra)}
.level b{font-family:var(--serif);font-size:2rem;color:var(--red);display:block;line-height:1}
.level.on{border-color:var(--green);box-shadow:0 3px 0 var(--green)}
/* flashcard – arch window */
.arch{max-width:380px;margin:0 auto 18px;min-height:280px;background:var(--paper);border:3px solid var(--terra);
  border-radius:190px 190px 18px 18px;padding:56px 24px 28px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--line);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;user-select:none}
.arch .it{font-family:var(--serif);font-size:2.3rem;font-weight:800}
.arch .cs{font-size:1.5rem;color:var(--green-d);font-weight:700}
.arch .ex{font-style:italic;color:var(--muted);font-size:.95rem}
.arch .hint{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;background:#f3e6c9;color:#7a5a1a;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:700}
/* options */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:14px 0}
.opt{font:inherit;font-weight:700;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center}
.opt:hover:not(:disabled){border-color:var(--terra)}
.opt.ok{background:#e1f3e7;border-color:var(--green)} .opt.bad{background:#fbe4e5;border-color:var(--red)}
.qword{font-family:var(--serif);font-size:2rem;font-weight:800;text-align:center;margin:8px 0}
.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
input[type=text]{font:inherit;width:100%;max-width:360px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
input[type=text]:focus{outline:none;border-color:var(--green)}
.fb{min-height:1.6em;font-weight:700;margin:8px 0}
.fb.ok{color:var(--green-d)} .fb.bad{color:var(--red-d)}
.lesson p,.lesson li{margin:6px 0} .lesson table{border-collapse:collapse;margin:10px 0}
.lesson td,.lesson th{border:1px solid var(--line);padding:5px 12px;text-align:left} .lesson th{background:#f3e6c9}
.lesson em{color:var(--red-d)}
.phrase{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.phrase:last-child{border:0} .phrase b{font-family:var(--serif);font-size:1.15rem} .phrase span{color:var(--muted);display:block}
.speak{font-size:1.2rem;padding:6px 10px}
.q{margin:18px 0 6px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 16px 40px;font-family:var(--serif);font-style:italic}
@media(max-width:520px){.arch{border-radius:150px 150px 18px 18px;padding-top:44px}}
</style>
</head>

const today = () => new Date().toISOString().slice(0,10);
function addXP(n){
  S.xp += n;
  const t = today();
  if (S.lastDay !== t){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = S.lastDay === y ? S.streak+1 : 1;
    S.lastDay = t;
  }
  save(); renderStats();
}

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();
const wordsOf = lvl => WORDS[lvl].map((w,i)=>({id:lvl+"-"+i,it:w[0],cs:w[1],ex:w[2]}));
function speak(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "it-IT"; u.rate = .9;
  speechSynthesis.speak(u);
}

/* ============ SHELL ============ */
const TABS = [["home","🏠 Domů"],["cards","🃏 Slovíčka"],["quiz","❓ Kvíz"],["write","✍️ Psaní"],["grammar","📖 Gramatika"],["phrases","💬 Fráze"]];
let view = "home";
function renderStats(){
  $("#stats").innerHTML = S.level
    ? `<span class="chip lvl" data-act="changeLevel" title="Změnit úroveň">Úroveň ${S.level} ✎</span><span class="chip">⭐ ${S.xp} XP</span><span class="chip">🔥 ${S.streak} ${S.streak===1?"den":"dní"}</span>`
    : "";
}
function renderNav(){
  $("#nav").innerHTML = S.level ? TABS.map(([k,l]) => `<button data-act="go" data-v="${k}" ${k===view?'aria-current="page"':""}>${l}</button>`).join("") : "";
}
function go(v){ view = v; renderNav(); renderStats(); const m = $("#main"); m.innerHTML = ""; (VIEWS[v] || VIEWS.home)(m); window.scrollTo(0,0); }

/* ============ VIEWS ============ */
const VIEWS = {};

function levelPicker(m){
  m.innerHTML = `<h2>Benvenuto! Vítejte 👋</h2>
    <p class="sub">Vyberte svou úroveň italštiny. Kdykoli ji můžete změnit. Nevíte? Zkuste krátký test.</p>
    <div class="grid">${Object.entries(LEVELS).map(([k,v]) => `
      <button class="card level ${S.level===k?"on":""}" data-act="pick" data-l="${k}"><b>${k}</b><strong>${v.name}</strong><br><span class="sub">${v.desc}</span></button>`).join("")}</div>
    <div class="row" style="margin-top:20px"><button class="btn red" data-act="placement">🎯 Určit mou úroveň testem (8 otázek)</button></div>`;
}

let PT = null;
function placementStep(m){
  if (PT.i >= PLACEMENT.length){
    const lvl = PT.score<=2?"A1":PT.score<=4?"A2":PT.score<=6?"B1":"B2";
    m.innerHTML = `<div class="card center"><h2>Výsledek: ${PT.score} / ${PLACEMENT.length}</h2>
      <p>Doporučená úroveň: <b style="font-size:1.6rem;color:var(--red)">${lvl}</b> – ${LEVELS[lvl].name}</p>
      <div class="row center"><button class="btn" data-act="pick" data-l="${lvl}">Začít na úrovni ${lvl}</button><button class="btn ghost" data-act="changeLevel">Vybrat ručně</button></div></div>`;
    return;
  }
  const q = PLACEMENT[PT.i];
  m.innerHTML = `<div class="card"><div class="progress"><i style="width:${PT.i/PLACEMENT.length*100}%"></i></div>
    <p class="sub" style="margin-top:10px">Otázka ${PT.i+1} / ${PLACEMENT.length}</p>
    <div class="qword">${esc(q.q)}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-act="ptAns" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <button class="btn ghost" data-act="ptSkip">Nevím</button></div>`;
}

VIEWS.home = m => {
  if (!S.level) return levelPicker(m);
  const ws = wordsOf(S.level), known = ws.filter(w => S.known[w.id]).length;
  const wod = ws[Math.floor(Date.now()/864e5) % ws.length];
  m.innerHTML = `<h2>Ciao! Pokračujeme na úrovni ${S.level}</h2><p class="sub">${LEVELS[S.level].name} – ${LEVELS[S.level].desc}</p>
    <div class="grid">
      <div class="card"><h3>Slovo dne</h3><div class="qword" style="text-align:left;margin:0">${esc(wod.it)} <button class="btn ghost speak" data-act="say" data-t="${esc(wod.it)}" aria-label="Přehrát">🔊</button></div>
        <div style="color:var(--green-d);font-weight:700">${esc(wod.cs)}</div><div class="sub" style="font-style:italic;margin:6px 0 0">${esc(wod.ex)}</div></div>
      <div class="card"><h3>Naučená slovíčka</h3><div class="qword" style="text-align:left;margin:0">${known} / ${ws.length}</div>
        <div class="progress"><i style="width:${known/ws.length*100}%"></i></div></div>
      <div class="card"><h3>Lekce gramatiky</h3><div class="qword" style="text-align:left;margin:0">${GRAMMAR[S.level].filter((_,i)=>S.grammarDone[S.level+i]).length} / ${GRAMMAR[S.level].length}</div>
        <div class="progress"><i style="width:${GRAMMAR[S.level].filter((_,i)=>S.grammarDone[S.level+i]).length/GRAMMAR[S.level].length*100}%"></i></div></div>
    </div>
    <h3 style="margin-top:26px">Co dnes procvičíme?</h3>
    <div class="row"><button class="btn" data-act="go" data-v="cards">🃏 Slovíčka</button><button class="btn" data-act="go" data-v="quiz">❓ Kvíz</button>
      <button class="btn" data-act="go" data-v="write">✍️ Psaní</button><button class="btn red" data-act="go" data-v="grammar">📖 Gramatika</button><button class="btn red" data-act="go" data-v="phrases">💬 Fráze</button></div>`;
};

/* --- Flashcards --- */
let CQ = [], CShow = false;
VIEWS.cards = m => {
  const ws = wordsOf(S.level);
  CQ = shuffle(ws.filter(w => !S.known[w.id])); CShow = false;
  drawCard(m);
};
function drawCard(m = $("#main")){
  const ws = wordsOf(S.level);
  if (!CQ.length){
    m.innerHTML = `<div class="card center"><h2>Bravo! 🎉</h2><p>Všechna slovíčka úrovně ${S.level} máte označená jako známá.</p>
      <button class="btn" data-act="resetKnown">Začít znovu</button></div>`;
    return;
  }
  const w = CQ[0], known = ws.filter(x => S.known[x.id]).length;
  m.innerHTML = `<h2>Slovíčka</h2><p class="sub">Klikněte na kartu pro překlad. Zbývá ${CQ.length}, známe ${known}/${ws.length}.</p>
    <div class="arch" data-act="flip" role="button" tabindex="0" aria-label="Otočit kartu">
      <span class="tag">${S.level}</span><div class="it">${esc(w.it)}</div>
      ${CShow ? `<div class="cs">${esc(w.cs)}</div><div class="ex">${esc(w.ex)}</div>` : `<div class="hint">Klikněte pro překlad</div>`}
    </div>
    <div class="row center"><button class="btn ghost" data-act="say" data-t="${esc(w.it)}">🔊 Poslechnout</button>
      <button class="btn red" data-act="cardNo">Ještě ne</button><button class="btn" data-act="cardYes">Znám ✓</button></div>`;
}

/* --- Quiz --- */
let Q = null;
VIEWS.quiz = m => {
  const ws = wordsOf(S.level);
  Q = {i:0, score:0, items: shuffle(ws).slice(0,8).map(w => ({w, dir: Math.random()<.5?"it":"cs"}))};
  quizStep(m);
};
function quizStep(m = $("#main")){
  const ws = wordsOf(S.level);
  if (Q.i >= Q.items.length){
    addXP(Q.score*2);
    m.innerHTML = `<div class="card center"><h2>Výsledek: ${Q.score} / ${Q.items.length}</h2><p>+${Q.score*2} XP ${Q.score===Q.items.length?"🏆 Perfetto!":Q.score>=5?"👍 Molto bene!":"💪 Ancora un po'!"}</p>
      <button class="btn" data-act="go" data-v="quiz">Znovu</button></div>`;
    return;
  }
  const {w, dir} = Q.items[Q.i];
  const others = shuffle(ws.filter(x => x.id !== w.id)).slice(0,3);
  const opts = shuffle([w, ...others]);
  Q.cur = {w, dir, correct: opts.indexOf(w)};
  m.innerHTML = `<h2>Kvíz</h2><div class="card"><div class="progress"><i style="width:${Q.i/Q.items.length*100}%"></i></div>
    <p class="sub" style="margin-top:10px">${dir==="it"?"Co znamená slovo?":"Jak se řekne italsky?"} (${Q.i+1}/${Q.items.length})</p>
    <div class="qword">${esc(dir==="it"?w.it:w.cs)}</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-act="qAns" data-i="${i}">${esc(dir==="it"?o.cs:o.it)}</button>`).join("")}</div>
    <div class="fb" aria-live="polite"></div></div>`;
}

/* --- Writing --- */
let W = null;
VIEWS.write = m => {
  W = {i:0, score:0, items: shuffle(wordsOf(S.level)).slice(0,8), checked:false};
  writeStep(m);
};
function writeStep(m = $("#main")){
  if (W.i >= W.items.length){
    addXP(W.score*3);
    m.innerHTML = `<div class="card center"><h2>Výsledek: ${W.score} / ${W.items.length}</h2><p>+${W.score*3} XP</p><button class="btn" data-act="go" data-v="write">Znovu</button></div>`;
    return;
  }
  const w = W.items[W.i]; W.checked = false;
  m.innerHTML = `<h2>Psaní</h2><p class="sub">Napište italsky. Diakritika (à, è…) se při hodnocení neřeší. (${W.i+1}/${W.items.length})</p>
    <form class="card" id="wform" autocomplete="off"><div class="qword">${esc(w.cs)}</div>
      <div class="row center"><input type="text" id="winp" aria-label="Italský překlad" autofocus><button class="btn" type="submit">Zkontrolovat</button></div>
      <div class="fb" id="wfb" aria-live="polite"></div></form>`;
  $("#winp").focus();
}

/* --- Grammar --- */
let GL = null;
VIEWS.grammar = m => {
  GL = null;
  const ls = GRAMMAR[S.level];
  m.innerHTML = `<h2>Gramatika · ${S.level}</h2><p class="sub">Krátké lekce s procvičením.</p>
    <div class="grid">${ls.map((l,i)=>`<button class="card level" data-act="lesson" data-i="${i}"><strong>${esc(l.title)}</strong><br><span class="sub">${S.grammarDone[S.level+i]?"✅ Dokončeno":"Nezačato"}</span></button>`).join("")}</div>`;
};
function lessonView(i){
  const l = GRAMMAR[S.level][i];
  GL = {i, answered:0, correct:0, total:l.quiz.length};
  $("#main").innerHTML = `<button class="btn ghost" data-act="go" data-v="grammar">← Zpět</button>
    <div class="card lesson" style="margin-top:12px"><h2>${esc(l.title)}</h2>${l.html}
    <h3 style="margin-top:20px">Procvičení</h3>
    ${l.quiz.map((q,qi)=>`<div class="q">${qi+1}. ${esc(q.q)}</div><div class="opts" data-q="${qi}">${q.o.map((o,oi)=>`<button class="opt" data-act="gAns" data-q="${qi}" data-i="${oi}">${esc(o)}</button>`).join("")}</div>`).join("")}
    <div class="fb" id="gfb" aria-live="polite"></div></div>`;
}

/* --- Phrases --- */
VIEWS.phrases = m => {
  m.innerHTML = `<h2>Užitečné fráze · ${S.level}</h2><p class="sub">Klikněte na 🔊 a poslechněte si výslovnost.</p>
    <div class="card">${PHRASES[S.level].map(p=>`<div class="phrase"><div><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>
      <button class="btn ghost speak" data-act="say" data-t="${esc(p[0])}" aria-label="Přehrát">🔊</button></div>`).join("")}</div>`;
};

/* ============ EVENTS ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset, m = $("#main");
  switch (d.act){
    case "go": go(d.v); break;
    case "changeLevel": view = "home"; renderNav(); const keep = S.level; S.level = null; levelPicker(m); S.level = keep; renderNav(); break;
    case "pick": S.level = d.l; save(); go("home"); break;
    case "placement": PT = {i:0, score:0}; placementStep(m); break;
    case "ptAns": if (+d.i === PLACEMENT[PT.i].a) PT.score++; PT.i++; placementStep(m); break;
    case "ptSkip": PT.i++; placementStep(m); break;
    case "say": speak(d.t); break;
    case "flip": CShow = !CShow; drawCard(); break;
    case "cardYes": S.known[CQ[0].id] = true; CQ.shift(); CShow = false; addXP(1); drawCard(); break;
    case "cardNo": CQ.push(CQ.shift()); CShow = false; drawCard(); break;
    case "resetKnown": wordsOf(S.level).forEach(w => delete S.known[w.id]); save(); go("cards"); break;
    case "qAns": {
      const c = Q.cur, ok = +d.i === c.correct;
      document.querySelectorAll(".opt").forEach((b,i) => { b.disabled = true; if (i===c.correct) b.classList.add("ok"); });
      if (ok) Q.score++; else el.classList.add("bad");
      const fb = $(".fb"); fb.className = "fb " + (ok?"ok":"bad");
      fb.innerHTML = (ok?"Správně! ":"Ne tak docela. ") + `<em>${esc(c.w.it)}</em> = ${esc(c.w.cs)}<br><span class="sub" style="font-weight:400;font-style:italic">${esc(c.w.ex)}</span> <button class="btn" data-act="qNext" style="margin-left:8px">Dál →</button>`;
      speak(c.w.it); break;
    }
    case "qNext": Q.i++; quizStep(); break;
    case "wNext": W.i++; writeStep(); break;
    case "lesson": lessonView(+d.i); break;
    case "gAns": {
      const q = GRAMMAR[S.level][GL.i].quiz[+d.q], ok = +d.i === q.a;
      const group = el.parentElement.querySelectorAll(".opt");
      group.forEach((b,i) => { b.disabled = true; if (i===q.a) b.classList.add("ok"); });
      if (!ok) el.classList.add("bad"); else GL.correct++;
      if (++GL.answered === GL.total){
        const fb = $("#gfb"); fb.className = "fb " + (GL.correct===GL.total?"ok":"bad");
        const first = !S.grammarDone[S.level+GL.i];
        if (GL.correct >= 2) S.grammarDone[S.level+GL.i] = true;
        fb.textContent = `Hotovo: ${GL.correct} / ${GL.total}` + (first ? ` · +${GL.correct*5} XP` : "");
        if (first) addXP(GL.correct*5); else save();
      }
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if ((e.key==="Enter"||e.key===" ") && e.target.matches('.arch[data-act="flip"]')){ e.preventDefault(); CShow = !CShow; drawCard(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "wform") return;
  e.preventDefault();
  if (W.checked) return;
  W.checked = true;
  const w = W.items[W.i], ok = norm($("#winp").value) === norm(w.it);
  if (ok) W.score++;
  $("#winp").disabled = true;
  const fb = $("#wfb"); fb.className = "fb " + (ok?"ok":"bad");
  fb.innerHTML = (ok?"Perfetto! ":"Správně je: ") + `<em>${esc(w.it)}</em> <button class="btn" type="button" data-act="wNext" style="margin-left:8px">Dál →</button>`;
  speak(w.it);
});

/* ============ START ============ */
renderStats(); go("home");
</script>
</body>
</html>
