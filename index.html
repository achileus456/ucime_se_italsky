:root{
  --cream:#fbf6ea; --paper:#fffdf7; --ink:#2b2118; --muted:#6f5f4d;
  --green:#008c45; --green-d:#006b35; --red:#cd212a; --red-d:#a31a21;
  --terra:#c8553d; --gold:#d9a441; --line:#e6dbc4;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px,rgba(200,85,61,.08) 1px,transparent 0);background-size:22px 22px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main:focus{outline:none}
.tricolore{height:8px;background:linear-gradient(90deg,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66%);border-bottom:1px solid var(--line)}
header{max-width:960px;margin:0 auto;padding:22px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand h1{font-family:var(--serif);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;line-height:1.1}
.brand h1 span{color:var(--red)}
.brand p{margin:2px 0 0;color:var(--muted);font-style:italic;font-family:var(--serif)}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
button.chip.lvl{border-color:var(--green);color:var(--green-d);cursor:pointer}
button.chip.lvl:hover{background:#e8f4ec}
nav{max-width:960px;margin:8px auto 0;padding:0 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line)}
nav button{font:inherit;font-weight:700;background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--red);border-bottom-color:var(--red)}
main{max-width:960px;margin:0 auto;padding:22px 16px 60px}
h2{font-family:var(--serif);font-size:1.7rem;margin:0 0 6px}
h3{font-family:var(--serif);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 0 var(--line)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{font:inherit;font-weight:700;border:2px solid var(--green);background:var(--green);color:#fff;border-radius:12px;padding:10px 18px;cursor:pointer;transition:transform .08s}
.btn:hover{background:var(--green-d)} .btn:active{transform:translateY(1px)}
.btn.red{background:var(--red);border-color:var(--red)} .btn.red:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--green-d)} .btn.ghost:hover{background:#e8f4ec}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}
.nosound .sp{display:none}
/* level picker */
.level{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s,border-color .12s}
.level:hover{transform:translateY(-3px);border-color:var(--terra)}
.level b{font-family:var(--serif);font-size:2rem;color:var(--red);display:block;line-height:1}
.level.on{border-color:var(--green);box-shadow:0 3px 0 var(--green)}
/* flashcard – arch window */
.arch{max-width:380px;margin:0 auto 18px;min-height:280px;background:var(--paper);border:3px solid var(--terra);
  border-radius:190px 190px 18px 18px;padding:56px 24px 28px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--line);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;user-select:none}
.arch .it{font-family:var(--serif);font-size:2.3rem;font-weight:800}
.arch .cs{font-size:1.5rem;color:var(--green-d);font-weight:700}
.arch .ex{font-style:italic;color:var(--muted);font-size:.95rem}
.arch .hint{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;background:#f3e6c9;color:#6d4f12;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:700}
/* options */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:14px 0}
.opt{font:inherit;font-weight:700;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center}

.opt:disabled{color:inherit;cursor:default}
.opt.ok{background:#e1f3e7;border-color:var(--green)} .opt.bad{background:#fbe4e5;border-color:var(--red)}
.qword{font-family:var(--serif);font-size:2rem;font-weight:800;text-align:center;margin:8px 0}
.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
input[type=text]{font:inherit;width:100%;max-width:360px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
input[type=text]:focus{outline:none;border-color:var(--green)}
.fb{min-height:1.6em;font-weight:700;margin:8px 0}
.fb.ok{color:var(--green-d)} .fb.bad{color:var(--red-d)}
.lesson p,.lesson li{margin:6px 0} .lesson table{border-collapse:collapse;margin:10px 0;display:block;overflow-x:auto}
.lesson td,.lesson th{border:1px solid var(--line);padding:5px 12px;text-align:left} .lesson th{background:#f3e6c9}
.lesson em{color:var(--red-d)}
.phrase{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.phrase:last-child{border:0} .phrase b{font-family:var(--serif);font-size:1.15rem} .phrase span.cz{color:var(--muted);display:block}
.speak{font-size:1.2rem;padding:6px 10px}
.q{margin:18px 0 6px;font-weight:700}
.big{font-family:var(--serif);font-size:2rem;font-weight:800;line-height:1.2}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 16px 40px;font-family:var(--serif);font-style:italic}
@media(max-width:600px){
  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible;border-bottom:0}
  nav button{padding:8px 4px;font-size:.9rem;border:2px solid var(--line);border-radius:10px;margin:0;background:var(--paper)}
  nav button[aria-current="page"]{border-color:var(--red);background:#fdeeee}
  .arch{border-radius:150px 150px 18px 18px;padding-top:44px}
}
</style>

      <p><em>Mi piace leggere. Mi piacciono gli spaghetti. Non mi piace il caffè.</em></p>`,
      quiz:[["___ la pizza. (Mám rád pizzu.)","Mi piace","Mi piacciono","Mi piaci"],["___ gli spaghetti. (Mám rád špagety.)","Mi piacciono","Mi piace","Mi piacete"],["A lei ___ leggere. (Ráda čte.)","piace","piacciono","piacere"],["Ai ragazzi ___ i videogiochi.","piacciono","piace","piacete"]]},
    {title:"Zvratná slovesa",html:`<p>Zvratná slovesa mají na konci infinitivu <em>-si</em> (alzarsi – vstávat) a před časovaným tvarem zvratné zájmeno.</p>
      <table><tr><th></th><th>alzarsi</th></tr><tr><td>io</td><td><em>mi</em> alzo</td></tr><tr><td>tu</td><td><em>ti</em> alzi</td></tr>
      <tr><td>lui/lei</td><td><em>si</em> alza</td></tr><tr><td>noi</td><td><em>ci</em> alziamo</td></tr><tr><td>voi</td><td><em>vi</em> alzate</td></tr><tr><td>loro</td><td><em>si</em> alzano</td></tr></table>
      <p>V passato prossimo se vždy používá <em>essere</em>: <em>Mi sono alzato presto.</em> (žena: <em>alzata</em>)</p>
      <p>Také: <em>chiamarsi</em> (jmenovat se) – <em>Mi chiamo Anna.</em>, <em>divertirsi</em> (bavit se), <em>lavarsi</em> (mýt se).</p>`,
      quiz:[["Io ___ alzo alle sette.","mi","ti","si"],["Lui ___ chiama Marco.","si","mi","ci"],["Noi ___ divertiamo molto.","ci","si","mi"],["Ieri mi ___ alzato presto. (passato prossimo)","sono","ho","sei"]]},
    {title:"Imperativ",html:`<p>Rozkazovací způsob: <em>tu, noi, voi</em> a zdvořilá forma <em>Lei</em>.</p>
      <table><tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th><th>finire</th></tr>
      <tr><td>tu</td><td><em>parla!</em></td><td><em>prendi!</em></td><td><em>dormi!</em></td><td><em>finisci!</em></td></tr>
      <tr><td>Lei</td><td><em>parli!</em></td><td><em>prenda!</em></td><td><em>dorma!</em></td><td><em>finisca!</em></td></tr>
      <tr><td>noi</td><td><em>parliamo!</em></td><td><em>prendiamo!</em></td><td><em>dormiamo!</em></td><td><em>finiamo!</em></td></tr>
      <tr><td>voi</td><td><em>parlate!</em></td><td><em>prendete!</em></td><td><em>dormite!</em></td><td><em>finite!</em></td></tr></table>
      <p>Zápor: <em>tu</em> → <em>non</em> + infinitiv (<em>Non parlare!</em>); <em>Lei, noi, voi</em> → <em>non</em> + imperativ (<em>Non parli! Non parliamo! Non parlate!</em>).</p>
      <p>Nepravidelné (tu): essere → <em>sii</em>, avere → <em>abbi</em>, andare → <em>vai</em>, fare → <em>fai</em>, dire → <em>di'</em>, venire → <em>vieni</em>, stare → <em>stai</em>.</p>`,
      quiz:[["___ la finestra! (Otevři okno! – tu, aprire)","Apri","Apre","Aprire"],["Non ___ così tanto! (Nemluv tolik! – tu, parlare)","parlare","parla","parli"],["___ con me, ragazzi! (Pojďte se mnou! – voi, venire)","Venite","Vieni","Vengono"],["Signor Rossi, ___ il conto! (Zaplaťte účet! – Lei, pagare)","paghi","paga","pagare"]]},
{title:"Srovnávání: comparativi a superlativi",html:`<p>Vyšší a nižší stupeň: <em>più</em> (více) a <em>meno</em> (méně) + přídavné jméno.</p>
      <ul><li><em>più … di</em> – srovnání dvou osob nebo věcí: <em>Roma è più grande <b>di</b> Firenze.</em></li>
      <li><em>più … che</em> – srovnání dvou vlastností, sloves nebo předložkových výrazů: <em>È più facile parlare <b>che</b> scrivere.</em></li>
      <li>Rovnost: <em>(così) … come</em> nebo <em>(tanto) … quanto</em>: <em>Marco è alto come Luca.</em></li>
      <li>Nejvyšší stupeň: <em>il / la più …</em> (+ <em>di</em>): <em>Milano è la città più grande d'Italia.</em> Absolutní superlativ: <em>bellissimo</em> (nádherný).</li></ul>
      <table><tr><th>základní</th><th>vyšší stupeň</th></tr><tr><td>buono / bene</td><td><em>migliore</em> / <em>meglio</em></td></tr>
      <tr><td>cattivo / male</td><td><em>peggiore</em> / <em>peggio</em></td></tr><tr><td>grande / piccolo</td><td><em>maggiore</em> / <em>minore</em></td></tr></table>`,
      quiz:[["Roma è più grande ___ Firenze. (než)","di","che","da"],["È più facile parlare ___ scrivere. (než)","che","di","come"],["Questo vino è ___ di quello. (lepší)","migliore","più migliore","più bene"],["Milano è la città ___ grande d'Italia. (největší)","più","molto","tanto"]]},
{title:"Zájmena nepřímého předmětu",html:`<p>Odpovídají na otázku <em>komu?</em> (<em>a chi?</em>) a stojí <em>před</em> slovesem: <em>Ti scrivo una lettera. Gli telefono domani.</em></p>
      <table><tr><th>komu</th><th>zájmeno</th></tr><tr><td>a me (mně)</td><td><em>mi</em></td></tr><tr><td>a te (tobě)</td><td><em>ti</em></td></tr>
      <tr><td>a lui (jemu)</td><td><em>gli</em></td></tr><tr><td>a lei (jí)</td><td><em>le</em></td></tr><tr><td>a Lei (Vám)</td><td><em>Le</em></td></tr>
      <tr><td>a noi (nám)</td><td><em>ci</em></td></tr><tr><td>a voi (vám)</td><td><em>vi</em></td></tr><tr><td>a loro (jim)</td><td><em>gli</em></td></tr></table>
      <p>Typická slovesa: <em>dare, dire, telefonare, scrivere, chiedere, spiegare</em>. V passato prossimo se příčestí nemění: <em>Le ho telefonato.</em></p>`,
      quiz:[["Maria, ___ scrivo domani. (Napíšu ti.)","ti","ci","gli"],["Telefono a Marco: ___ telefono. (jemu)","gli","le","lo"],["Signora, ___ porto subito il caffè. (Vám)","Le","Gli","Ti"],["Noi parliamo ai ragazzi: ___ spieghiamo la lezione. (jim)","gli","le","ci"]]},
{title:"Modální slovesa: potere, volere, dovere",html:`<p>Modální slovesa vyjadřují schopnost, vůli a povinnost. Po nich následuje infinitiv.</p>
      <table><tr><th></th><th>potere (moci)</th><th>volere (chtít)</th><th>dovere (muset)</th></tr>
      <tr><td>io</td><td><em>posso</em></td><td><em>voglio</em></td><td><em>devo</em></td></tr><tr><td>tu</td><td><em>puoi</em></td><td><em>vuoi</em></td><td><em>devi</em></td></tr>
      <tr><td>lui/lei</td><td><em>può</em></td><td><em>vuole</em></td><td><em>deve</em></td></tr><tr><td>noi</td><td><em>possiamo</em></td><td><em>vogliamo</em></td><td><em>dobbiamo</em></td></tr>
      <tr><td>voi</td><td><em>potete</em></td><td><em>volete</em></td><td><em>dovete</em></td></tr><tr><td>loro</td><td><em>possono</em></td><td><em>vogliono</em></td><td><em>devono</em></td></tr></table>
      <p><em>Posso entrare? Voglio imparare l'italiano. Devo studiare. Non posso venire.</em></p>
      <p>V passato prossimo se používá <em>avere</em>: <em>Ho dovuto aspettare.</em> Zdvořilé přání: <em>Vorrei un caffè.</em></p>`,
      quiz:[["Io ___ studiare molto. (Musím hodně studovat.)","devo","voglio","posso"],["Noi ___ andare al mare. (Chceme jet k moři.)","vogliamo","dobbiamo","possiamo"],["Loro non ___ venire stasera. (Nemohou dnes večer přijít.)","possono","vogliono","devono"],["Lei ___ parlare italiano. (Ona může mluvit italsky.)","può","puoi","possono"]]}
  ],
  B1:[
    {title:"Imperfetto × passato prossimo",html:`<p><em>Imperfetto</em> = opakovaný nebo trvající děj, popis v minulosti (<em>Quando ero piccolo, giocavo ogni giorno</em>).</p>
      <p><em>Passato prossimo</em> = jednorázový, ukončený děj (<em>Ieri ho giocato a calcio</em>).</p>
      <p>Kombinace: <em>Mentre camminavo, ho incontrato Luca.</em></p>
      <table><tr><th></th><th>-are (parlare)</th><th>-ere (vedere)</th><th>-ire (dormire)</th></tr>
      <tr><td>io</td><td>parl<em>avo</em></td><td>ved<em>evo</em></td><td>dorm<em>ivo</em></td></tr><tr><td>tu</td><td>parl<em>avi</em></td><td>ved<em>evi</em></td><td>dorm<em>ivi</em></td></tr>
      <tr><td>lui/lei</td><td>parl<em>ava</em></td><td>ved<em>eva</em></td><td>dorm<em>iva</em></td></tr><tr><td>noi</td><td>parl<em>avamo</em></td><td>ved<em>evamo</em></td><td>dorm<em>ivamo</em></td></tr>
      <tr><td>voi</td><td>parl<em>avate</em></td><td>ved<em>evate</em></td><td>dorm<em>ivate</em></td></tr><tr><td>loro</td><td>parl<em>avano</em></td><td>ved<em>evano</em></td><td>dorm<em>ivano</em></td></tr></table>
      <p>Nepravidelné: <em>ero, eri, era…</em> (essere), <em>facevo</em> (fare).</p>`,
      quiz:[["Da piccolo ___ spesso con mio nonno. (často, opakovaně)","giocavo","ho giocato","giocherò"],["Ieri ___ un film. (jednorázový děj)","ho guardato","guardavo","guardo"],["Mentre ___ la cena, è squillato il telefono.","preparavo","ho preparato","preparerò"],["Quando ___ giovane, vivevo a Praga.","ero","sono","sarò"]]},
    {title:"Condizionale",html:`<p>Podmiňovací způsob: zdvořilé žádosti, přání, rady.</p>
      <p>Tvoření: infinitiv (bez -e) + <em>-ei, -esti, -ebbe, -emmo, -este, -ebbero</em>. U sloves na <em>-are</em> se <em>a</em> mění na <em>e</em>: parlare → parl<em>erei</em>.</p>
      <p><em>Vorrei un caffè. Potresti aiutarmi? Dovresti riposare.</em></p>
      <p>Nepravidelné kmeny: avere → <em>avrei</em>, essere → <em>sarei</em>, andare → <em>andrei</em>.</p>`,
      quiz:[["___ un caffè, per favore. (zdvořilá žádost)","Vorrei","Voglio","Volevo"],["Un consiglio: tu ___ riposare di più. (měl bys)","dovresti","devi","dovevi"],["Condizionale od essere (io):","sarei","sarò","ero"],["Io ___ volentieri al mare. (rád bych šel)","andrei","vado","andavo"]]},
    {title:"Futuro semplice",html:`<p>Budoucí čas: infinitiv (bez -e) + <em>-ò, -ai, -à, -emo, -ete, -anno</em>. U sloves na <em>-are</em> se <em>a</em> mění na <em>e</em>.</p>
      <table><tr><th></th><th>parlare</th><th>vendere</th><th>partire</th></tr>
      <tr><td>io</td><td>parl<em>erò</em></td><td>vend<em>erò</em></td><td>part<em>irò</em></td></tr><tr><td>tu</td><td>parl<em>erai</em></td><td>vend<em>erai</em></td><td>part<em>irai</em></td></tr>
      <tr><td>lui/lei</td><td>parl<em>erà</em></td><td>vend<em>erà</em></td><td>part<em>irà</em></td></tr><tr><td>noi</td><td>parl<em>eremo</em></td><td>vend<em>eremo</em></td><td>part<em>iremo</em></td></tr>
      <tr><td>voi</td><td>parl<em>erete</em></td><td>vend<em>erete</em></td><td>part<em>irete</em></td></tr><tr><td>loro</td><td>parl<em>eranno</em></td><td>vend<em>eranno</em></td><td>part<em>iranno</em></td></tr></table>
      <p>Nepravidelné: essere → <em>sarò</em>, avere → <em>avrò</em>, andare → <em>andrò</em>, fare → <em>farò</em>, venire → <em>verrò</em>. Slovesa na <em>-ciare, -giare</em> ztrácejí <em>i</em>: mangiare → <em>mangerò</em>.</p>`,
      quiz:[["Domani io ___ a Roma. (andare – budoucí čas)","andrò","andai","andavo"],["Tu ___ contento. (essere – budoucí čas)","sarai","sei","eri"],["Noi ___ la pizza. (mangiare – budoucí čas)","mangeremo","mangiamo","mangiavamo"],["Lei ___ domani. (partire – budoucí čas)","partirà","parte","partiva"]]},
    {title:"Zájmena lo, la, li, le",html:`<p>Zájmena přímého předmětu stojí <em>před</em> slovesem: <em>Vedo Marco → <b>Lo</b> vedo.</em></p>
      <table><tr><th>zájmeno</th><th>nahrazuje</th></tr><tr><td><em>lo</em></td><td>m. j. č. (il libro)</td></tr><tr><td><em>la</em></td><td>ž. j. č. (la mela)</td></tr>
      <tr><td><em>li</em></td><td>m. mn. č. (i libri)</td></tr><tr><td><em>le</em></td><td>ž. mn. č. (le mele)</td></tr></table>
      <p>Před samohláskou se <em>lo/la</em> krátí: <em>L'ho visto.</em></p>
      <p>V passato prossimo se příčestí shoduje se zájmenem: <em>Ho visto Maria → L'ho <b>vista</b>. Ho comprato i libri → Li ho compra<b>ti</b>.</em></p>`,
      quiz:[["Vedo Maria. → ___ vedo.","La","Lo","Li"],["Compro i libri. → ___ compro.","Li","Lo","Le"],["Mangio le mele. → ___ mangio.","Le","Li","La"],["Ho visto Maria. → L'ho ___","vista","visto","visti"]]},
    {title:"Trapassato prossimo",html:`<p>Předminulý čas: děj, který proběhl <em>před</em> jiným dějem v minulosti. Tvoří se z imperfekta pomocného slovesa (<em>avere</em> nebo <em>essere</em>) + příčestí.</p>
      <table><tr><th></th><th>avere</th><th>essere</th></tr>
      <tr><td>io</td><td><em>avevo</em> mangiato</td><td><em>ero</em> andato/a</td></tr><tr><td>tu</td><td><em>avevi</em> mangiato</td><td><em>eri</em> andato/a</td></tr>
      <tr><td>lui/lei</td><td><em>aveva</em> mangiato</td><td><em>era</em> andato/a</td></tr><tr><td>noi</td><td><em>avevamo</em> mangiato</td><td><em>eravamo</em> andati/e</td></tr>
      <tr><td>voi</td><td><em>avevate</em> mangiato</td><td><em>eravate</em> andati/e</td></tr><tr><td>loro</td><td><em>avevano</em> mangiato</td><td><em>erano</em> andati/e</td></tr></table>
      <p><em>Quando sono arrivato, il film era già iniziato.</em> (Nejdřív film začal, potom jsem přišel.)</p>
      <p>Pomocné sloveso je stejné jako v passato prossimo a příčestí s <em>essere</em> se shoduje s podmětem. Často se pojí s <em>già</em> (už), <em>non… ancora</em> (ještě ne), <em>prima che</em>.</p>`,
      quiz:[["Quando sono arrivato alla stazione, il treno ___ già partito.","era","ha","sarebbe"],["Prima di cena io ___ già fatto i compiti. (trapassato prossimo)","avevo","ero","avrei"],["Avevamo ___ il biglietto prima di partire. (comprare)","comprato","comprare","compro"],["Lei ___ andata al mare prima che piovesse. (trapassato prossimo)","era","aveva","sarebbe"]]},
{title:"Částice ci a ne",html:`<p>Malá slůvka <em>ci</em> a <em>ne</em> nahrazují celé části věty. Stojí před časovaným slovesem.</p>
      <table><tr><th>částice</th><th>význam</th><th>příklad</th></tr>
      <tr><td><em>ci</em></td><td>tam (místo)</td><td>Vai a Roma? – Sì, <em>ci</em> vado domani.</td></tr>
      <tr><td><em>ci</em></td><td>na to, o tom (s předložkou <em>a</em>)</td><td>Penso al lavoro. → <em>Ci</em> penso spesso.</td></tr>
      <tr><td><em>ne</em></td><td>z toho, o tom (s předložkou <em>di</em>)</td><td>Parliamo del film. → <em>Ne</em> parliamo.</td></tr>
      <tr><td><em>ne</em></td><td>z toho (část množství)</td><td>Quante mele hai? – <em>Ne</em> ho tre.</td></tr></table>
      <p>V passato prossimo se příčestí s <em>ne</em> shoduje s množstvím: <em>Di mele ne ho mangiate due.</em> Ustálené obraty: <em>Che ne pensi?</em> (Co si o tom myslíš?), <em>Ci vuole…</em> (Je třeba…), <em>Non ne posso più.</em> (Už nemůžu.)</p>`,
      quiz:[["Vai a Roma? – Sì, ___ vado domani. (tam)","ci","ne","lo"],["Vuoi del caffè? – Sì, ___ voglio un po'. (z toho)","ne","ci","lo"],["Quante mele hai? – ___ ho tre. (jablka: mám jich tři)","Ne","Ci","Le"],["Sei mai stato a Venezia? – Sì, ___ sono stato due volte.","ci","ne","lo"]]},
{title:"Formální imperativ a zápor",html:`<p>Rozkazovací způsob se liší podle vykání a tykání:</p>
      <table><tr><th></th><th>tu (kladný)</th><th>Lei (vykání)</th></tr>
      <tr><td>parlare</td><td>parl<em>a</em></td><td>parl<em>i</em></td></tr><tr><td>prendere</td><td>prend<em>i</em></td><td>prend<em>a</em></td></tr>
      <tr><td>dormire</td><td>dorm<em>i</em></td><td>dorm<em>a</em></td></tr><tr><td>finire</td><td>fin<em>isci</em></td><td>fin<em>isca</em></td></tr></table>
      <p>Nepravidelné (tu / Lei): essere → <em>sii / sia</em>, avere → <em>abbi / abbia</em>, andare → <em>va' / vada</em>, fare → <em>fa' / faccia</em>, dire → <em>di' / dica</em>, venire → <em>vieni / venga</em>.</p>
      <p>Formální imperativ (Lei) = tvar congiuntivo presente: <em>Mi dica! Prenda la prima a destra. Aspetti un momento.</em></p>
      <p>Zápor pro <em>tu</em>: <em>non</em> + infinitiv (<em>Non parlare così!</em>). Pro <em>Lei</em> se jen přidá <em>non</em> (<em>Non parli così!</em>).</p>`,
      quiz:[["Signor Rossi, ___ un momento, per favore. (aspettare – Lei)","aspetti","aspetta","aspettare"],["Scusi, ___ la prima strada a destra. (prendere – Lei)","prenda","prendi","prende"],["Marco, non ___ così tanto! (parlare – zákaz pro tu)","parlare","parla","parli"],["Dottore, mi ___ la verità! (dire – Lei)","dica","dì","dice"]]},
{title:"Nepřímá řeč v minulosti",html:`<p>Když převádíme cizí slova po slovese v minulosti (<em>ha detto che…</em>), čas ve vedlejší větě se „posouvá“ do minulosti:</p>
      <table><tr><th>přímá řeč</th><th>nepřímá řeč (po minulém čase)</th></tr>
      <tr><td>presente: «Sono stanco.»</td><td>imperfetto: Ha detto che <em>era</em> stanco.</td></tr>
      <tr><td>passato prossimo: «Ho finito.»</td><td>trapassato prossimo: Ha detto che <em>aveva finito</em>.</td></tr>
      <tr><td>futuro: «Verrò domani.»</td><td>condizionale passato: Ha detto che <em>sarebbe venuto</em>.</td></tr></table>
      <p>Posouvají se i časové výrazy: <em>oggi → quel giorno, ieri → il giorno prima, domani → il giorno dopo, ora → allora</em>.</p>
      <p><em>Paolo: «Domani vengo.» → Paolo ha detto che sarebbe venuto il giorno dopo.</em></p>
      <p>Pozor: pokud je sdělení stále platné, v hovorové řeči se čas často nemění, ale ve cvičení vždy uplatňujeme pravidlo souslednosti.</p>`,
      quiz:[["Luca: «Sono stanco.» → Luca ha detto che ___ stanco. (souslednost časů)","era","è","sarà"],["Anna: «Ho finito.» → Anna ha detto che ___ finito. (souslednost časů)","aveva","ha","avrà"],["Paolo: «Verrò domani.» → Paolo ha detto che ___ venuto il giorno dopo. (souslednost časů)","sarebbe","verrà","è"],["Sara: «Mangio la pizza.» → Sara ha detto che ___ la pizza. (souslednost časů)","mangiava","mangia","mangerà"]]}
  ],
  B2:[
    {title:"Congiuntivo presente",html:`<p>Používá se po výrazech názoru, pochybnosti, přání: <em>penso che, credo che, è possibile che, voglio che, spero che</em>.</p>
      <p><em>Penso che lui <b>abbia</b> ragione. Credo che sia tardi. Voglio che tu venga.</em></p>
      <table><tr><th></th><th>essere</th><th>avere</th></tr><tr><td>io/tu/lui</td><td>sia</td><td>abbia</td></tr><tr><td>noi</td><td>siamo</td><td>abbiamo</td></tr><tr><td>loro</td><td>siano</td><td>abbiano</td></tr></table>
      <p>Pravidelně: -are → <em>-i, -i, -i, -iamo, -iate, -ino</em> (parlare → che io parli); -ere/-ire → <em>-a, -a, -a, -iamo, -iate, -ano</em> (vendere → venda, dormire → dorma, finire → finisca).</p>`,
      quiz:[["Penso che lui ___ ragione.","abbia","ha","avrà"],["Credo che ___ già tardi.","sia","è","sarà"],["Voglio che tu ___ con me.","venga","vieni","verrai"],["Spero che tu ___ bene. (stare)","stia","stai","starai"]]},
    {title:"Periodo ipotetico",html:`<p>Podmínkové věty tří typů:</p>
      <ul><li>Reálná: <em>Se piove, resto a casa.</em></li>
      <li>Nereálná přítomná: <em>Se avessi tempo, leggerei di più.</em> (congiuntivo imperfetto + condizionale)</li>
      <li>Nereálná minulá: <em>Se avessi saputo, sarei venuto.</em> (congiuntivo trapassato + condizionale passato)</li></ul>
      <p>Congiuntivo imperfetto: essere → <em>fossi, fossi, fosse, fossimo, foste, fossero</em>; avere → <em>avessi, avessi, avesse…</em></p>`,
      quiz:[["Se ___ tempo, viaggerei di più.","avessi","ho","avrò"],["Se avessi saputo, ___ venuto.","sarei","sono","ero"],["Se avessi i soldi, ___ una casa. (koupil bych)","comprerei","compro","comprai"],["Se fossi in te, ___ questo lavoro. (přijal bych)","accetterei","accettai","accetterò"]]},
    {title:"Passivo",html:`<p>Pasivum se tvoří <em>essere</em> + příčestí, které se shoduje s podmětem. Původce děje uvádí <em>da</em>.</p>
      <p><em>La casa è stata costruita da mio nonno. Il progetto è stato approvato. Le lettere sono state spedite.</em></p>
      <p>V jednoduchých časech lze použít i <em>venire</em> + příčestí: <em>Il libro viene letto da molti.</em></p>`,
      quiz:[["La casa è stata ___ nel 1900. (costruire)","costruita","costruito","costruiti"],["Le lettere sono state ___ ieri. (spedire)","spedite","spedito","spedita"],["Il progetto ___ approvato ieri.","è stato","ha stato","è stata"],["La finestra è stata ___ da Luca.","chiusa","chiuso","chiusi"]]},
    {title:"Vztažná zájmena",html:`<table><tr><th>zájmeno</th><th>použití</th></tr>
      <tr><td><em>che</em></td><td>podmět nebo předmět bez předložky: <em>Il libro che leggo è bello.</em></td></tr>
      <tr><td><em>cui</em></td><td>po předložce: <em>La persona di cui parlo. L'amico con cui viaggio. La città in cui vivo.</em></td></tr>
      <tr><td><em>il quale</em></td><td>formálnější náhrada, shoduje se v rodě a čísle: <em>la persona con la quale parlo</em></td></tr></table>
      <p>Pozor: po <em>che</em> se předložka nikdy nedává (<em>che</em> × <em>di che</em> neexistuje).</p>`,
      quiz:[["Il libro ___ ho letto è bello.","che","cui","chi"],["La ragazza di ___ ti ho parlato è mia sorella.","cui","che","quale"],["La città in ___ vivo è piccola.","cui","che","chi"],["L'amico con ___ viaggio è italiano.","cui","che","chi"]]},
    {title:"Kombinovaná zájmena",html:`<p>Když se v jedné větě sejde zájmeno nepřímého a přímého předmětu, spojí se. Nepřímé zájmeno je <em>první</em> a mění se: <em>mi → me, ti → te, ci → ce, vi → ve, gli/le → glie-</em>.</p>
      <table><tr><th></th><th>lo</th><th>la</th><th>li</th><th>le</th><th>ne</th></tr>
      <tr><td>mi</td><td>me lo</td><td>me la</td><td>me li</td><td>me le</td><td>me ne</td></tr>
      <tr><td>ti</td><td>te lo</td><td>te la</td><td>te li</td><td>te le</td><td>te ne</td></tr>
      <tr><td>gli / le / Le</td><td>glielo</td><td>gliela</td><td>glieli</td><td>gliele</td><td>gliene</td></tr>
      <tr><td>ci</td><td>ce lo</td><td>ce la</td><td>ce li</td><td>ce le</td><td>ce ne</td></tr>
      <tr><td>vi</td><td>ve lo</td><td>ve la</td><td>ve li</td><td>ve le</td><td>ve ne</td></tr></table>
      <p><em>Mi presti il libro? — Sì, te lo presto. Hai dato il regalo a Maria? — Sì, gliel'ho dato.</em></p>
      <p>S infinitivem a rozkazem se zájmena připojují ke slovesu: <em>Dammelo! Voglio dirtelo.</em> (nebo <em>Te lo voglio dire.</em>)</p>`,
      quiz:[["Mi presti la penna? — Sì, ___ presto. (ti ji půjčím)","te la","te lo","ce la"],["Hai dato il regalo a Maria? — Sì, ___ ho dato. (dal jsem jí ho)","gliel'","te l'","me l'"],["Dai il libro a me! → ___ !","Dammelo","Mi lo dai","Dallo mi"],["Parlo a Luca di questo problema. → ___ parlo. (mluvím mu o tom)","Gliene","Glielo","Gliela"]]},
    {title:"Congiuntivo passato",html:`<p>Congiuntivo passato = <em>congiuntivo presente</em> sloves <em>avere</em> nebo <em>essere</em> + příčestí. Vyjadřuje děj, který proběhl <em>před</em> dějem hlavní věty v přítomnosti.</p>
      <table><tr><th></th><th>mangiare</th><th>andare</th></tr>
      <tr><td>io / tu / lui</td><td><em>abbia</em> mangiato</td><td><em>sia</em> andato/a</td></tr><tr><td>noi</td><td><em>abbiamo</em> mangiato</td><td><em>siamo</em> andati/e</td></tr>
      <tr><td>voi</td><td><em>abbiate</em> mangiato</td><td><em>siate</em> andati/e</td></tr><tr><td>loro</td><td><em>abbiano</em> mangiato</td><td><em>siano</em> andati/e</td></tr></table>
      <p><em>Penso che Marco sia partito. Credo che lei abbia già mangiato. Non credo che siano arrivati.</em></p>
      <p>Příčestí s <em>essere</em> se shoduje s podmětem.</p>`,
      quiz:[["Penso che Marco ___ già partito.","sia","abbia","è"],["Credo che lei ___ già mangiato.","abbia","sia","ha"],["Spero che voi ___ dormito bene.","abbiate","abbiano","avete"],["Non credo che loro ___ arrivati.","siano","abbiano","sono"]]},
    {title:"Condizionale passato",html:`<p>Condizionale passato = <em>condizionale presente</em> sloves <em>avere</em> nebo <em>essere</em> + příčestí. Vyjadřuje nesplněné přání, výtku nebo lítost a hlavní větu nereálné minulé podmínky.</p>
      <table><tr><th></th><th>avere</th><th>essere</th></tr>
      <tr><td>io</td><td><em>avrei</em> mangiato</td><td><em>sarei</em> andato/a</td></tr><tr><td>tu</td><td><em>avresti</em> mangiato</td><td><em>saresti</em> andato/a</td></tr>
      <tr><td>lui/lei</td><td><em>avrebbe</em> mangiato</td><td><em>sarebbe</em> andato/a</td></tr><tr><td>noi</td><td><em>avremmo</em> mangiato</td><td><em>saremmo</em> andati/e</td></tr>
      <tr><td>voi</td><td><em>avreste</em> mangiato</td><td><em>sareste</em> andati/e</td></tr><tr><td>loro</td><td><em>avrebbero</em> mangiato</td><td><em>sarebbero</em> andati/e</td></tr></table>
      <ul><li>Výtka, lítost: <em>Avrei dovuto studiare di più.</em> <em>Avresti dovuto chiamarmi.</em></li>
      <li>Nesplněné přání: <em>Sarei venuto volentieri, ma ero occupato.</em></li>
      <li>Podmínka: <em>Se non ci fosse stato traffico, sarebbe arrivata puntuale.</em></li></ul>`,
      quiz:[["Avrei ___ studiare di più. (Měl jsem víc studovat.)","dovuto","dovere","dovuta"],["Io ___ venuto volentieri, ma ero occupato.","sarei","avrei","sono"],["Tu ___ dovuto chiamarmi. (Měl jsi mi zavolat.)","avresti","saresti","avrai"],["Maria ___ arrivata puntuale, se non ci fosse stato traffico.","sarebbe","avrebbe","è"]]},
    {title:"Spojky a congiuntivo",html:`<p>Některé spojky se <em>vždy</em> pojí s konjunktivem, jiné s indikativem.</p>
      <table><tr><th>congiuntivo</th><th>indicativo</th></tr>
      <tr><td><em>benché, sebbene</em> (ačkoli)</td><td><em>dopo che</em> (poté co)</td></tr>
      <tr><td><em>affinché</em> (aby)</td><td><em>mentre</em> (zatímco)</td></tr>
      <tr><td><em>purché</em> (pokud jen)</td><td><em>poiché, siccome, giacché</em> (protože)</td></tr>
      <tr><td><em>a meno che (non)</em> (leda že)</td><td><em>perché</em> v příčinném významu (protože)</td></tr>
      <tr><td><em>prima che</em> (dříve než)</td><td></td></tr>
      <tr><td><em>senza che</em> (aniž by)</td><td></td></tr></table>
      <p><em>Benché fosse stanco, ha continuato. Esco prima che cominci a piovere. Dopo che abbiamo finito la cena, siamo usciti.</em></p>
      <p>Pozor: <em>perché</em> je s konjunktivem jen ve významu „aby“ (<em>Te lo dico perché tu sappia la verità</em>), jinak se pojí s indikativem.</p>`,
      quiz:[["Benché ___ stanco, ha continuato a lavorare. (byl)","fosse","era","sarà"],["Esco prima che ___ a piovere. (začne)","cominci","comincia","comincerà"],["Dopo che ___ la cena, siamo usciti. (jsme dojedli)","abbiamo finito","avessimo finito","finissimo"],["Ti aiuto purché tu ___ onesto con me. (jsi)","sia","sei","sarai"]]}
  ],
  C1:[
    {title:"Souslednost časů: congiuntivo imperfetto a trapassato",html:`<p>Čas konjunktivu se řídí hlavní větou:</p>
      <table><tr><th>hlavní věta</th><th>současně</th><th>dříve</th></tr>
      <tr><td>přítomnost</td><td><em>Penso che sia tardi.</em> (congiuntivo presente)</td><td><em>Penso che sia partito.</em> (congiuntivo passato)</td></tr>
      <tr><td>minulost / condizionale</td><td><em>Pensavo che fosse tardi.</em> (congiuntivo imperfetto)</td><td><em>Pensavo che fosse partito.</em> (congiuntivo trapassato)</td></tr></table>
      <p><em>Vorrei che tu venissi con me. Credevo che avesse ragione.</em></p>
      <p>Congiuntivo imperfetto: -are → <em>-assi, -assi, -asse, -assimo, -aste, -assero</em>; -ere → <em>-essi…</em>; -ire → <em>-issi…</em>. Nepravidelné: essere → <em>fossi</em>, fare → <em>facessi</em>, dire → <em>dicessi</em>, stare → <em>stessi</em>.</p>`,
      quiz:[["Pensavo che lui ___ ragione.","avesse","abbia","ha"],["Credevo che lei ___ già partita.","fosse","sia","era"],["Vorrei che tu ___ con me. (venire)","venissi","venga","verresti"],["Penso che lei ___ già partita. (odjela už)","sia","fosse","è"]]},
    {title:"Passato remoto",html:`<p>Používá se v literatuře, ve vyprávění o vzdálené minulosti a v mluvě jižní Itálie: <em>Dante nacque a Firenze nel 1265.</em></p>
      <table><tr><th></th><th>parlare</th><th>essere</th><th>avere</th></tr>
      <tr><td>io</td><td>parl<em>ai</em></td><td><em>fui</em></td><td><em>ebbi</em></td></tr><tr><td>tu</td><td>parl<em>asti</em></td><td><em>fosti</em></td><td>av<em>esti</em></td></tr>
      <tr><td>lui/lei</td><td>parl<em>ò</em></td><td><em>fu</em></td><td><em>ebbe</em></td></tr><tr><td>noi</td><td>parl<em>ammo</em></td><td><em>fummo</em></td><td>av<em>emmo</em></td></tr>
      <tr><td>voi</td><td>parl<em>aste</em></td><td><em>foste</em></td><td>av<em>este</em></td></tr><tr><td>loro</td><td>parl<em>arono</em></td><td><em>furono</em></td><td><em>ebbero</em></td></tr></table>
      <p>Další nepravidelná (3. os. j. č.): andare → <em>andò</em>, fare → <em>fece</em>, dire → <em>disse</em>, nascere → <em>nacque</em>, vedere → <em>vide</em>, venire → <em>venne</em>.</p>`,
      quiz:[["Dante ___ a Firenze nel 1265. (nascere – passato remoto)","nacque","nasceva","nascerà"],["Io ___ a Roma nel 1990. (essere – passato remoto)","fui","fosse","sarò"],["Lui ___ la verità. (dire – passato remoto)","disse","dice","dirà"],["Passato remoto od avere (io):","ebbi","avevo","avrò"]]},
    {title:"Gerundio",html:`<p>Gerundio se tvoří: -are → <em>-ando</em>, -ere/-ire → <em>-endo</em> (parlando, vendendo, dormendo). Nepravidelné: fare → <em>facendo</em>, dire → <em>dicendo</em>, bere → <em>bevendo</em>.</p>
      <ul><li><em>stare + gerundio</em> = probíhající děj: <em>Sto leggendo un libro.</em></li>
      <li>vedlejší věta časová, příčinná nebo způsobová: <em>Attraversando la strada, ho incontrato Luca.</em> / <em>Studiando si impara.</em></li>
      <li>minulé: <em>avendo / essendo</em> + příčestí: <em>Avendo finito, sono uscito.</em></li></ul>
      <p>Pozor: podmět gerundia je zpravidla stejný jako podmět hlavní věty.</p>`,
      quiz:[["Sto ___ un libro. (leggere)","leggendo","leggando","letto"],["Lei sta ___ la cena. (preparare)","preparando","preparendo","preparata"],["___ la strada, ho incontrato Luca. (attraversare)","Attraversando","Attraversendo","Attraversare"],["Gerundio od fare:","facendo","fando","facando"]]},
    {title:"Neosobní a pasivní si",html:`<p><em>Si</em> + 3. osoba vyjadřuje neosobní děj („se, člověk“):</p>
      <ul><li>Neosobní: <em>In Italia si mangia bene.</em> <em>Non si sa mai.</em></li>
      <li>Pasivní <em>si</em>: sloveso se shoduje s předmětem – <em>Qui si parla italiano.</em> (j. č.), <em>Si vendono case.</em> (mn. č.)</li></ul>
      <p>V passato prossimo se vždy používá <em>essere</em>: <em>Si è detto molto.</em></p>`,
      quiz:[["Qui ___ italiano. (Tady se mluví italsky.)","si parla","si parlano","si parlo"],["In questo negozio ___ scarpe. (Prodávají se boty.)","si vendono","si vende","si vendiamo"],["In Italia ___ bene. (Jí se dobře.)","si mangia","si mangiano","si mangi"],["Non ___ mai! (Člověk nikdy neví!)","si sa","si sanno","si so"]]},
    {title:"Futuro anteriore",html:`<p>Složený budoucí čas: <em>avere</em> nebo <em>essere</em> ve futuru + příčestí: <em>avrò finito, sarò partito/a</em>.</p>
      <table><tr><th></th><th>avere</th><th>essere</th></tr>
      <tr><td>io</td><td><em>avrò</em> mangiato</td><td><em>sarò</em> andato/a</td></tr><tr><td>tu</td><td><em>avrai</em> mangiato</td><td><em>sarai</em> andato/a</td></tr>
      <tr><td>lui/lei</td><td><em>avrà</em> mangiato</td><td><em>sarà</em> andato/a</td></tr><tr><td>noi</td><td><em>avremo</em> mangiato</td><td><em>saremo</em> andati/e</td></tr>
      <tr><td>voi</td><td><em>avrete</em> mangiato</td><td><em>sarete</em> andati/e</td></tr><tr><td>loro</td><td><em>avranno</em> mangiato</td><td><em>saranno</em> andati/e</td></tr></table>
      <ul><li>Děj dokončený před jiným budoucím dějem: <em>Quando avrò finito, ti telefonerò.</em> <em>Dopo che avremo mangiato, usciremo.</em></li>
      <li>Předpoklad o minulosti: <em>Non risponde: sarà già uscito.</em> (Asi už odešel.) <em>Avrà avuto trent'anni.</em> (Mohlo mu být asi třicet.)</li></ul>`,
      quiz:[["Quando ___ finito il lavoro, ti telefonerò. (futuro anteriore)","avrò","avevo","avessi"],["Non risponde: ___ già uscito. (předpoklad – futuro anteriore)","sarà","fosse","sia"],["Dopo che ___ mangiato, usciremo. (futuro anteriore, noi)","avremo","abbiamo","avevamo"],["Futuro anteriore od andare (Maria):","sarà andata","avrà andato","andrà"]]},
{title:"Nepřímá řeč v minulosti",html:`<p>Když je věta uvozující řeč v minulosti (<em>ha detto, disse, aveva detto</em>), časy v nepřímé řeči se posouvají:</p>
      <table><tr><th>přímá řeč</th><th>nepřímá řeč</th></tr>
      <tr><td>presente: „Sono stanco.“</td><td><em>Ha detto che era stanco.</em> (imperfetto)</td></tr>
      <tr><td>passato prossimo: „Ho mangiato.“</td><td><em>Ha detto che aveva mangiato.</em> (trapassato prossimo)</td></tr>
      <tr><td>futuro semplice: „Verrò.“</td><td><em>Ha detto che sarebbe venuto.</em> (condizionale passato)</td></tr>
      <tr><td>imperativ: „Vieni!“</td><td><em>Mi ha detto di venire.</em> (di + infinito)</td></tr></table>
      <p>Mění se i určení času a místa: <em>oggi</em> → <em>quel giorno</em>, <em>domani</em> → <em>il giorno dopo</em>, <em>ieri</em> → <em>il giorno prima</em>, <em>qui</em> → <em>lì</em>.</p>`,
      quiz:[["Posuňte časy: „Verrò domani.“ → Ha detto che ___ il giorno dopo.","sarebbe venuto","verrà","verrebbe"],["Posuňte časy: „Ho mangiato.“ → Ha detto che ___ mangiato.","aveva","ha","avrà"],["„Chiama Anna!“ → Mi ha detto ___ Anna.","di chiamare","che chiamo","chiamare"],["Posuňte časy: „Oggi sono occupato.“ → Ha detto che ___ era occupato.","quel giorno","oggi","domani"]]},
{title:"Kauzativ: fare a lasciare + infinitiv",html:`<p><em>Fare + infinitiv</em> = způsobit, že se něco stane, nebo někoho přimět něco udělat („nechat“): <em>Faccio riparare la macchina.</em> (Nechám opravit auto.) <em>Il film mi fa ridere.</em> (Film mě rozesmívá.)</p>
      <p>Zájmena stojí před <em>fare</em>: <em>La faccio riparare.</em> <em>Gli faccio mangiare la verdura.</em> Osoba, která děj vykoná, se uvádí s <em>a</em>, je-li v větě i předmět: <em>Ho fatto pulire la casa a Luca.</em></p>
      <p><em>Lasciare + infinitiv</em> = dovolit, nechat (nebránit): <em>Lasciami parlare!</em> (Nech mě mluvit!) <em>Non lo lascio uscire.</em> (Nepustím ho ven.)</p>`,
      quiz:[["Domani ___ riparare la macchina. (dám opravit – kauzativ)","faccio","sono","vado"],["Lasciami ___! (Nech mě mluvit!)","parlare","parlato","parlando"],["Quel film mi ___ ridere. (Ten film mě rozesmívá.)","fa","lascia","è"],["Ho fatto ___ la casa a Luca. (Nechala jsem Luku uklidit dům.)","pulire","pulito","pulita"]]},
{title:"Infinito passato a participio assoluto",html:`<p><em>Infinito passato</em> = <em>avere/essere</em> v infinitivu + příčestí. Vyjadřuje předčasnost při stejném podmětu: <em>Dopo aver finito, sono uscito.</em> <em>Dopo essere arrivati, hanno chiamato.</em> Také: <em>Senza aver capito nulla</em> (aniž by cokoli pochopil). Naopak <em>prima di + infinito</em> (bez příčestí): <em>Prima di uscire, ho chiamato.</em></p>
      <p><em>Participio assoluto</em> = samostatné příčestí v knižním stylu, shoduje se s předmětem děje: <em>Finita la lezione, gli studenti sono usciti.</em> (Poté, co skončila hodina…) <em>Letto il libro, l'ha restituito.</em> <em>Arrivati a casa, ci siamo riposati.</em></p>`,
      quiz:[["___ aver finito, sono uscito. (Poté, co jsem skončil)","Dopo","Prima","Senza"],["Finita la lezione, gli studenti ___ usciti.","sono","hanno","avevano"],["___ la lettera, l'ho spedita subito. (participio assoluto)","Scritta","Scritto","Scrivere"],["Dopo ___ arrivati, hanno chiamato. (infinito passato od essere)","essere","aver","avendo"]]}
  ]
};

  ["C1","Pensavo che lui ___ già partito.","fosse","sia","era"],
  ["C1","Non è un problema, ___ un'opportunità.","bensì","benché","perciò"],
  ["C1","Dante ___ a Firenze nel 1265. (passato remoto)","nacque","nasceva","nascerà"]
];

/* ============ STATE ============ */
const LS_KEY = "italiano-v1";
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const defaults = () => ({level:null, xp:0, streak:0, lastDay:null, mastery:{}, learned:{}, grammarDone:{}});
function sanitize(raw){
  const s = defaults();
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return s;
  if (typeof raw.level === "string" && has(LEVELS, raw.level)) s.level = raw.level;
  if (Number.isFinite(raw.xp) && raw.xp > 0) s.xp = Math.floor(raw.xp);
  if (Number.isFinite(raw.streak) && raw.streak > 0) s.streak = Math.floor(raw.streak);
  if (typeof raw.lastDay === "string" && /^\d{4}-\d{2}-\d{2}$/.test(raw.lastDay)) s.lastDay = raw.lastDay;
  const each = (o, f) => { if (o && typeof o === "object" && !Array.isArray(o)) for (const k of Object.keys(o)) f(k, o[k]); };
  each(raw.mastery, (k,v) => { if (Number.isFinite(v) && v > 0) s.mastery[k] = Math.min(4, Math.floor(v)); });
  each(raw.learned, (k,v) => { if (v === true) s.learned[k] = true; });
  each(raw.grammarDone, (k,v) => { if (v === true) s.grammarDone[k] = true; });
  each(raw.known, (k,v) => { if (v === true) { s.mastery[k] = Math.max(s.mastery[k]||0, 3); s.learned[k] = true; } }); // starší verze
  return s;
}
let S = defaults();
try { S = sanitize(JSON.parse(localStorage.getItem(LS_KEY))); } catch(e) {}
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} };
const dayKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function touch(){
  const t = dayKey(new Date());
  if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  S.streak = S.lastDay === dayKey(y) ? S.streak+1 : 1;
  S.lastDay = t;
}
function curStreak(){
  const now = new Date(), y = new Date(); y.setDate(y.getDate()-1);
  return (S.lastDay === dayKey(now) || S.lastDay === dayKey(y)) ? S.streak : 0;
}
const isKnown = id => (S.mastery[id]||0) >= 2;
function setMastery(id, val){
  const was = isKnown(id);
  S.mastery[id] = Math.max(0, Math.min(4, val));
  touch();
  if (!was && isKnown(id) && !S.learned[id]){ S.learned[id] = true; S.xp += 5; }   // XP jen za nově naučené slovo
  save(); renderStats();
}
const bump = (id, ok) => setMastery(id, (S.mastery[id]||0) + (ok ? 1 : -1));
function lessonDone(key, correct){            // XP jen při prvním splnění lekce
  touch();
  if (!S.grammarDone[key]){ S.grammarDone[key] = true; S.xp += correct*5; }
  save(); renderStats();
}

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IT = s => `<span lang="it">${esc(s)}</span>`;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[’‘`´]/g,"'").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();
const WC = {};
function wordsOf(lvl){
  return WC[lvl] || (WC[lvl] = WORDS[lvl].map((w,i) => ({
    id:lvl+"-"+i, it:w[0], cs:w[1], ex:w[2], art:w[3]||"",
    full: w[3] ? (w[3].endsWith("'") ? w[3]+w[0] : w[3]+" "+w[0]) : w[0],
    mean: w[1].toLowerCase().split(/\s*,\s*/)
  })));
}
const sameMeaning = (a,b) => a.mean.some(m => b.mean.includes(m));
const pick = (ws,n) => { const u = shuffle(ws.filter(w => !isKnown(w.id))), k = shuffle(ws.filter(w => isKnown(w.id))); return u.concat(k).slice(0,n); };
const mcq = ([q,c,...w]) => ({q, opts:shuffle([c,...w]).map(t => ({t, ok:t===c}))});
/* výslovnost */
let itVoice = null, voicesFinal = false;
const speechOK = "speechSynthesis" in window;
function loadVoices(){
  let ok = speechOK;
  if (speechOK){
    const vs = speechSynthesis.getVoices();
    itVoice = vs.find(v => /^it([-_]|$)/i.test(v.lang)) || null;
    if (vs.length) voicesFinal = true;
    if (voicesFinal && !itVoice) ok = false;
    if (!vs.length && voicesFinal) ok = false;
  }
  document.body.classList.toggle("nosound", !ok);
}
function speak(text){
  if (!speechOK || document.body.classList.contains("nosound")) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "it-IT"; u.rate = .9;
  if (itVoice) u.voice = itVoice;
  speechSynthesis.speak(u);
}
const spBtn = (t, label="") => `<button class="btn ghost speak sp" data-act="say" data-t="${esc(t)}" aria-label="Přehrát výslovnost: ${esc(t)}">🔊${label}</button>`;

let CQ = [], CShow = false;

function drawCard(m = $("#main")){

function flipCard(){ CShow = !CShow; drawCard(); const a = $(".arch"); if (a) a.focus(); }

/* --- Quiz --- */
let Q = null;
VIEWS.quiz = m => {

};
function quizStep(m = $("#main")){
  const ws = wordsOf(S.level);
  if (Q.i >= Q.items.length){
    const gain = S.xp - Q.xp0;

      <p>${Q.score===Q.items.length?"🏆 Perfetto!":Q.score>=5?"👍 Molto bene!":"💪 Ancora un po'!"} ${gain ? `+${gain} XP za nově naučená slova.` : "Slovo se stane naučeným po druhé správné odpovědi."}</p>

/* ============ EVENTS ============ */
let resetArmed = false;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset, m = $("#main");
  switch (d.act){
    case "go": go(d.v); break;
    case "changeLevel": view = "home"; renderNav(); levelPicker(m, S.level); m.focus({preventScroll:true}); break;
    case "pick": if (!has(LEVELS,d.l)) break; S.level = d.l; save(); go("home"); break;
    case "placement":
      PT = {i:0, bands:Object.fromEntries(LEVEL_KEYS.map(k => [k,0])), items:PLACEMENT.map(([lvl,q,c,...w]) => ({lvl, ...mcq([q,c,...w])}))};
      placementStep(m); break;
    case "ptAns": { const q = PT.items[PT.i]; if (q.opts[+d.i].ok) PT.bands[q.lvl]++; PT.i++; placementStep(m); break; }
    case "ptSkip": PT.i++; placementStep(m); break;
    case "say": speak(d.t); break;
    case "flip": flipCard(); break;
    case "cardYes": { const w = CQ.shift(); CShow = false; setMastery(w.id, Math.max(2, S.mastery[w.id]||0)); drawCard(); break; }
    case "cardNo": { const w = CQ.shift(); CQ.push(w); CShow = false; bump(w.id,false); drawCard(); break; }
    case "resetKnown": wordsOf(S.level).forEach(w => delete S.mastery[w.id]); save(); go("cards"); break;
    case "resetAll":
      if (!resetArmed){ resetArmed = true; el.textContent = "Opravdu smazat? Klikněte znovu"; setTimeout(() => { resetArmed = false; if (el.isConnected) el.textContent = "Smazat veškerý pokrok"; }, 4000); break; }
      resetArmed = false; S = Object.assign(defaults(), {level:S.level}); save(); go("home"); break;
    case "qAns": {
      const c = Q.cur, ok = +d.i === c.correct;
      document.querySelectorAll(".opt").forEach((b,i) => { b.disabled = true; if (i===c.correct) b.classList.add("ok"); });
      if (ok) Q.score++; else el.classList.add("bad");
      bump(c.w.id, ok);
      const fb = $(".fb"); fb.className = "fb " + (ok?"ok":"bad");
      fb.innerHTML = (ok?"Správně! ":"Ne tak docela. ") + `${IT(c.w.full)} = ${esc(c.w.cs)}<br><span class="sub" style="font-weight:400;font-style:italic">${IT(c.w.ex)}</span> ${spBtn(c.w.full)} <button class="btn" data-act="qNext" style="margin-left:8px">${Q.i+1>=Q.items.length?"Výsledek":"Dál"} →</button>`;
      $("[data-act=qNext]").focus(); break;
    }
    case "qNext": Q.i++; quizStep(); $("#main").focus({preventScroll:true}); break;
    case "wNext": W.i++; writeStep(); break;
    case "lesson": lessonView(+d.i); break;
    case "gAns": {
      const q = GL.qs[+d.q], ok = q.opts[+d.i].ok;
      el.parentElement.querySelectorAll(".opt").forEach((b,i) => { b.disabled = true; if (q.opts[i].ok) b.classList.add("ok"); });
      if (!ok) el.classList.add("bad"); else GL.correct++;
      if (++GL.answered === GL.qs.length){
        const total = GL.qs.length, pass = GL.correct >= total-1, fb = $("#gfb"), first = !S.grammarDone[GL.key];
        fb.className = "fb " + (pass?"ok":"bad");
        if (pass){
          fb.textContent = `Splněno: ${GL.correct} / ${total}` + (first ? ` · +${GL.correct*5} XP` : "");
          lessonDone(GL.key, GL.correct);
        } else {
          fb.innerHTML = `Zatím ${GL.correct} / ${total}. Zkuste to znovu: <button class="btn small" data-act="lesson" data-i="${GL.i}">Zkusit znovu</button>`;
        }
      }
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if ((e.key==="Enter"||e.key===" ") && e.target.matches('.arch[data-act="flip"]')){ e.preventDefault(); flipCard(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "wform") return;
  e.preventDefault();
  if (W.checked) return;
  const raw = $("#winp").value, ans = norm(raw), fb = $("#wfb");
  if (!ans){ fb.className = "fb bad"; fb.textContent = "Napište odpověď."; return; }
  W.checked = true;
  const w = W.items[W.i], pool = wordsOf(S.level);
  let ok = ans === norm(w.it) || ans === norm(w.full), alt = null;
  if (!ok){
    alt = pool.find(x => x.id !== w.id && (ans === norm(x.it) || ans === norm(x.full)) && sameMeaning(x,w));
    ok = !!alt;
  }
  if (ok) W.score++;
  bump(w.id, ok);
  $("#winp").disabled = true;
  const lc = raw.trim().toLowerCase(), accentNote = ok && !alt && lc !== w.it && lc !== w.full && lc.replace(/[’‘`´]/g,"'") !== w.full;
  fb.className = "fb " + (ok?"ok":"bad");
  fb.innerHTML = (ok ? (alt ? `Také správně! (${IT(alt.full)}). Hledané slovo bylo ` : "Perfetto! ") : "Správně je: ") + `${IT(w.full)}` +
    (accentNote ? `<br><span class="sub" style="font-weight:400">Pozor na přízvuk / psaní: ${IT(w.full)}</span>` : "") +
    ` ${spBtn(w.full)} <button class="btn" type="button" data-act="wNext" style="margin-left:8px">${W.i+1>=W.items.length?"Výsledek":"Dál"} →</button>`;
  $("[data-act=wNext]").focus();
});

/* ============ START ============ */
if (speechOK){ speechSynthesis.onvoiceschanged = loadVoices; setTimeout(() => { voicesFinal = true; loadVoices(); }, 1500); }
loadVoices();
renderStats(); go("home");
</script>
